<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enseñanzas y costumbres de mi comunidad</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================
         PORTADA
    ================================== -->

    <section class="portada">

        <!-- Fondo animado -->
        <div class="fondo">

            <span class="particula"></span>
            <span class="particula"></span>
            <span class="particula"></span>
            <span class="particula"></span>
            <span class="particula"></span>

        </div>


        <!-- TARJETA -->

        <div class="tarjeta">

            <!-- TÍTULO -->

            <div class="titulo">

                <h1>
                    Enseñanzas y<br>
                    costumbres<br>
                    de mi comunidad
                </h1>

            </div>


            <!-- IMAGEN -->

            <div class="contenedor-imagen">

                <img
                    src="resources/libros.png"
                    alt="Ilustración de la comunidad"
                    class="imagen-libros"
                >

            </div>


            <!-- BOTÓN -->

            <button id="btnComenzar">

                COMENZAR

                <span>↓</span>

            </button>

        </div>

    </section>



    <!-- =================================
         HISTORIETA
    ================================== -->

    <main id="historia">

        <section class="titulo-capitulo">

            <p>Autor: Carlos Navarro V.</p>

            <h2>
                El Eco de la Muliza
            </h2>

        </section>


        <!-- =================================
             AQUÍ VAN TUS VIÑETAS
        ================================== -->

        <section class="vinetas">

            <img
                src="resources/1.png"
                alt="Viñeta 1"
            >

            <img
                src="resources/2.png"
                alt="Viñeta 2"
            >

            <img
                src="resources/3.png"
                alt="Viñeta 3"
            >
            <img
                src="resources/4.png"
                alt="Viñeta 4"
            >
        </section>


        <!-- FINAL -->

        <section class="final">

            <h2>
                CONTINUARÁ...
            </h2>

            <button id="btnInicio">
                ↑ Volver al inicio
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
